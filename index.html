<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .loader {
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }

    .countdown {
      font-size: 1rem;
      margin-top: 15px;
      opacity: 0.7;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🚧 Under Construction</h1>
    <p>We’re working hard to bring something amazing. Stay tuned!</p>

    <div class="loader"></div>

    <div class="countdown" id="countdown"></div>
  </div>

  <footer>
    &copy; <span id="year"></span> All Rights Reserved
  </footer>

  <script>
    // Set current year
    document.getElementById("year").textContent = new Date().getFullYear();

    // Optional countdown (set your launch date here)
    const launchDate = new Date("2026-06-01T00:00:00").getTime();

    const countdownEl = document.getElementById("countdown");

    const updateCountdown = () => {
      const now = new Date().getTime();
      const distance = launchDate - now;

      if (distance < 0) {
        countdownEl.textContent = "We are live!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);

      countdownEl.textContent =
        `Launching in ${days}d ${hours}h ${minutes}m`;
    };

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
